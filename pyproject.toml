[project]
name = "infermesh"
version = "0.1.0"
description = "Lightweight distributed LLM inference gateway with KV-cache-aware routing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "PyYAML>=6.0",
    "structlog>=24.4.0",
    "redis>=5.0.0",
    "aiofiles>=23.0.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
]

[dependency-groups]
bench = [
    "locust>=2.30.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infermesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
