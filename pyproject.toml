[project]
name = "infermesh"
version = "0.1.0"
description = "Lightweight distributed LLM inference gateway with KV-cache-aware routing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162",
    "starlette>=1.10",
    "uvicorn[standard]>=0.54",
    "httpx>=0.28.0",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "python-dotenv>=1.2",
    "PyYAML>=6.0",
    "structlog>=26.1",
    "redis>=8.1",
    "prometheus-client>=0.26",
    "opentelemetry-api>=1.45",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp>=1.45",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infermesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
